# Atlas OCI SSH baseline. Reverse forwarding remains enabled for ArchiveOS.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
GatewayPorts no
PermitTunnel no
PermitUserEnvironment no
