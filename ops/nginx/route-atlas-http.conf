server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    # Let's Encrypt HTTP-01 challenge remains reachable on plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # Deny hidden-file probes before the catch-all HTTPS redirect.
    include /etc/nginx/snippets/atlas-deny-hidden-locations.conf;

    location / {
        return 301 https://161.33.17.84$request_uri;
    }
}
