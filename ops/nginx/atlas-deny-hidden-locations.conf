# Include this in every public server block, including the port 80 redirect
# server, so hidden-file probes are denied before SPA fallback or HTTPS redirect.
# ACME is handled by a higher-priority ^~ location.
location ^~ /.env {
    return 404;
}

location ^~ /.git {
    return 404;
}

location ^~ /.svn {
    return 404;
}

location ^~ /.hg {
    return 404;
}

location ~ /\.(?!well-known(?:/|$)) {
    return 404;
}
