<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071a2f">
  <meta name="description" content="개념부터 실습, 검증, 회상 시험까지 이어지는 32일 백엔드 실무 학습">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../assets/backend-atlas-icon.png">
  <link rel="stylesheet" href="backend-study.css?v=backend-study-v1">
  <title>백엔드 실무 학습 · Backend Atlas</title>
</head>
<body>
  <div class="study-shell">
    <header class="study-header">
      <a href="../" class="study-brand" aria-label="Backend Atlas 홈으로">
        <img src="../assets/backend-atlas-icon.png" alt="">
        <span><strong>BACKEND ATLAS</strong><small>백엔드 실무 학습</small></span>
      </a>
      <div class="header-progress" aria-label="전체 학습 진행률">
        <span id="headerProgressText">0 / 32 DAY</span>
        <i><b id="headerProgressBar"></b></i>
      </div>
      <button id="resetStudy" class="ghost-button" type="button">기록 초기화</button>
    </header>

    <main id="backendStudyRoot" tabindex="-1"></main>

    <nav class="study-nav" aria-label="백엔드 실무 학습 메뉴">
      <button type="button" data-study-route="home" aria-current="page"><span>⌂</span>홈</button>
      <button type="button" data-study-route="exam"><span>✓</span>시험</button>
      <button type="button" data-study-route="review"><span>↻</span>복습</button>
      <button type="button" data-study-route="progress"><span>▦</span>진도</button>
    </nav>
    <p id="studyStatus" class="sr-only" role="status" aria-live="polite"></p>
  </div>
  <script src="data/backend-study-data.js?v=backend-study-v1"></script>
  <script src="backend-study-state.js?v=backend-study-v1"></script>
  <script src="backend-study-app.js?v=backend-study-v1"></script>
</body>
</html>
